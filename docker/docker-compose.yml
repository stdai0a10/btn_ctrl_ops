name: btn_ctrl_ops
version: "3.9"

x-service: &base_service
  restart: always
  extra_hosts:
    - host.docker.internal:host-gateway
  logging:
    driver: "json-file"
    options:
      max-size: "10m"

services:

  cfargotunnel:
    <<: *base_service
    container_name: cfargotunnel
    hostname: cfargotunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token-file=/run/secrets/cloudflared_tunnel_token
    networks:
      - external
    volumes:
      - ../cloudflared:/etc/cloudflared
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - cloudflared_tunnel_token
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  traefik:
    <<: *base_service
    container_name: traefik
    hostname: traefik
    image: traefik:v3.7
    networks:
      - external
      - internal
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ../traefik:/etc/traefik
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  btn-ctrl-center:
    <<: *base_service
    build:
      context: ${BTN_CTRL_CENTER_CONTEXT}
      dockerfile: ${BTN_CTRL_CENTER_DOCKERFILE}
    env_file:
      - ${BTN_CTRL_CENTER_ENV}
    networks:
      - internal
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.btn-ctrl-center.rule=Host(`${BTN_CTRL_CENTER_HOST:-btn-ctrl-center.localhost}`)
      - traefik.http.services.btn-ctrl-center.loadbalancer.server.port=80
      - traefik.http.services.btn-ctrl-center.loadbalancer.healthcheck.path=/

  demo:
    <<: *base_service
    image: nginx:alpine
    profiles:
      - demo
    restart: "no"
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - internal
    volumes:
      - ../demo:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.demo.rule=Host(`${DEMO_HOST:-demo.localhost}`)

  mysql:
    <<: *base_service
    container_name: mysql
    hostname: mysql
    image: mysql:9.7
    profiles:
      - mysql
    networks:
      - internal
    ports:
      - "3306:3306"
    volumes:
      - ../mysql/log:/var/log/mysql
      - ../mysql/data:/var/lib/mysql
      # - ../mysql/conf.d:/etc/mysql/conf.d
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
    secrets:
      - mysql_root_password


networks:
  external:
    driver: bridge
  internal:
    driver: bridge

secrets:
  cloudflared_tunnel_token:
    file: ../cloudflared/tunnel_token.txt
  mysql_root_password:
    file: ../mysql/root_password.txt
